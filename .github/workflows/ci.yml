name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev

      # Builds every frontend/target via the Makefile (SDL GUI, text CLI, and the
      # two test runners), each linking the shared CalculatorEngine — this is the
      # first place simpleCalculator.cpp is compiled and linked against SDL2. CI
      # overrides CXXFLAGS to add -Werror so new warnings fail the build, while a
      # local `make` stays non-fatal (Makefile keeps -Wall -Wextra).
      - name: Build (Makefile)
        run: make CXXFLAGS="-std=c++17 -Wall -Wextra -Werror"

      # Runs the engine + parser assert-based test suite; a failing assertion
      # aborts with a non-zero status and fails the job.
      - name: Run engine tests
        run: ./testingParsing

      # Runs the SDL frontend's event-translation tests. The runner has no
      # display, which is why the suite selects SDL's dummy video driver and
      # software renderer itself rather than relying on the environment. It
      # loads the real PNG assets by relative path, so it runs from the
      # repository directory.
      - name: Run frontend tests
        run: ./testingFrontend

      # Runs the text frontend's input-dispatch tests. It includes
      # textCalculator.cpp directly and drives its main() with std::cin/std::cout
      # redirected to string buffers, so it needs neither SDL nor the PNG assets
      # and could run on a runner with no SDL2 installed at all.
      - name: Run text frontend tests
        run: ./testingTextFrontend

      # End-to-end check of the text frontend driving the shared engine. This
      # complements the suite above rather than duplicating it: it is the only
      # step that runs the real binary as a separate process against a real pipe.
      - name: Smoke-test the text frontend
        run: |
          printf '12+3=\n2*3+4=\nq\n' | ./textCalculator | tee /tmp/out
          grep -q '= 15' /tmp/out
          grep -q '= 10' /tmp/out
